<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #000;
            overflow: hidden;
            color: #333;
        }

        /* 视频背景 */
        #video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; opacity: 0; transition: opacity 1.5s ease;
        }
        #bg-video { width: 100%; height: 100%; object-fit: cover; }

        /* 全屏遮罩 */
        #main-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 0.5s ease;
        }

        /* 卡片容器 */
        .card {
            background: white; border-radius: 16px; padding: 40px;
            width: 90%; max-width: 500px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow: hidden; /* 确保隐私政策滑入时不超出 */
        }

        /* 按钮样式 */
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: #000; color: #fff; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }

        /* 隐私政策滑入层 */
        #privacy-panel {
            position: absolute; top: 0; left: 100%; /* 默认在右侧外部 */
            width: 100%; height: 100%; background: #fff;
            padding: 40px; box-sizing: border-box;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; z-index: 101;
        }
        #privacy-panel.active { left: 0; }
        .privacy-content { overflow-y: auto; flex-grow: 1; margin-bottom: 20px; text-align: left; font-size: 0.9rem; }

        /* 顶部小功能条：语言切换 */
        .top-bar {
            position: absolute; top: 15px; right: 20px;
            display: flex; gap: 10px; align-items: center;
        }
        .lang-switch {
            font-size: 12px; cursor: pointer; color: #007bff; text-decoration: underline;
        }

        .link-style { margin-top: 20px; font-size: 0.85rem; color: #888; cursor: pointer; text-decoration: underline; display: block; text-align: center; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="bg-video" src="https://www.w3schools.com/html/mov_bbb.mp4" playsinline></video>
    </div>

    <div id="main-overlay">
        <div class="card">
            <div class="top-bar">
                <span class="lang-switch" onclick="toggleLanguage()">English / 中文</span>
            </div>

            <div id="main-content">
                <h2 id="txt-title"></h2>
                <p id="txt-desc1" style="text-align: left;"></p>
                <p id="txt-desc2" style="color: #d9534f; font-weight: bold; text-align: left; font-size: 0.85rem;"></p>
                
                <div class="btn-group">
                    <button class="btn-primary" id="btn-accept" onclick="startExperience()"></button>
                    <button class="btn-secondary" id="btn-decline" onclick="startExperience()"></button>
                </div>
                <span class="link-style" id="txt-privacy-link" onclick="openPrivacy()"></span>
            </div>

            <div id="privacy-panel">
                <h3 id="txt-privacy-title"></h3>
                <div class="privacy-content" id="txt-privacy-body"></div>
                <button class="btn-primary" id="btn-back" onclick="closePrivacy()"></button>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "Cookies & Content",
                desc1: "This website uses cookies to offer you the most relevant information and better understand how you use this website.",
                desc2: "User-generated content may not be suitable for visitors who are at high risk of photosensitive epileptic seizes.",
                accept: "Accept",
                decline: "Decline",
                privacyLink: "Privacy policy",
                pTitle: "Privacy Policy",
                pBody: "We value your privacy. This site collects minimal data to ensure video delivery. We do not sell your personal information to third parties. By using this site, you agree to our terms.",
                back: "Back to Home"
            },
            zh: {
                title: "Cookie 与内容声明",
                desc1: "本网站使用 Cookie 以为您提供最相关的信息，并帮助我们了解您的使用偏好。",
                desc2: "用户生成内容可能不适合患有光敏性癫痫高风险的访客，请谨慎观看。",
                accept: "接受",
                decline: "拒绝",
                privacyLink: "隐私政策",
                pTitle: "隐私政策声明",
                pBody: "我们非常重视您的隐私。本网站仅收集必要的基础数据以保证视频的正常加载。我们承诺不会将您的个人信息出售给第三方。继续访问即表示您同意我们的条款。",
                back: "返回首页"
            }
        };

        let currentLang = 'en';

        // 初始化语言：检测浏览器或默认英文
        function initLanguage() {
            const userLang = navigator.language || navigator.userLanguage;
            currentLang = userLang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
            updateUI();
        }

        // 手动切换语言
        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'zh' : 'en';
            updateUI();
        }

        // 更新页面所有文本
        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-desc1').innerText = t.desc1;
            document.getElementById('txt-desc2').innerText = t.desc2;
            document.getElementById('btn-accept').innerText = t.accept;
            document.getElementById('btn-decline').innerText = t.decline;
            document.getElementById('txt-privacy-link').innerText = t.privacyLink;
            document.getElementById('txt-privacy-title').innerText = t.pTitle;
            document.getElementById('txt-privacy-body').innerText = t.pBody;
            document.getElementById('btn-back').innerText = t.back;
        }

        // 隐私政策面板切换
        function openPrivacy() { document.getElementById('privacy-panel').classList.add('active'); }
        function closePrivacy() { document.getElementById('privacy-panel').classList.remove('active'); }

        // 开始播放流程
        function startExperience() {
            const overlay = document.getElementById('main-overlay');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('bg-video');

            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                videoContainer.style.display = 'block';
                setTimeout(() => { 
                    videoContainer.style.opacity = '1';
                    video.play(); // 用户已交互，音频可自动播放
                }, 100);
            }, 500);
        }

        window.onload = initLanguage;
    </script>
</body>
</html>
